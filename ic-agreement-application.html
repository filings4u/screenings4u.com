<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join the Independent Contractor Network | screenings4u</title><style>body{margin:0;background:#f1f5f9;color:#183653;font:15px/1.6 Arial}.wrap{max-width:780px;margin:30px auto;background:white;padding:34px;border-radius:15px}header{border-bottom:5px solid #ff6b00;padding-bottom:15px}h1{color:#325aa3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;font-weight:600;margin-top:12px}input,select{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbcadd;border-radius:8px}button{background:#ff6b00;color:white;border:0;border-radius:8px;padding:14px 22px;margin-top:20px;cursor:pointer}.check{display:flex;gap:10px;align-items:start}.check input{width:auto;margin-top:6px}@media(max-width:650px){.wrap{margin:0;padding:18px}.grid{grid-template-columns:1fr}}</style><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></head><body><main class="wrap"><header><h1>screenings4u | IC Network</h1><p>Independent Contractor Agreement & Application</p></header><p>No sign-in required. Review the <a href="/ic-network-agreement.html" target="_blank" rel="noopener">complete agreement and exhibits</a> before signing. Rates remain subject to written assignment or Exhibit A.</p><form id="form"><div class="grid"><label>Legal name / business<input name="full_name" required maxlength="150"></label><label>Authorized representative<input name="representative" required maxlength="150"></label><label>Email<input type="email" name="email" required></label><label>Phone<input type="tel" name="phone" required></label><label>Entity type<input name="entity_type" placeholder="Individual, LLC, Corporation"></label><label>Title<input name="title"></label><label>Street address<input name="address" required></label><label>City, State, ZIP<input name="city_state_zip" required></label></div><label>Electronic signature — type legal name exactly<input name="signature" required></label><label class="check"><input type="checkbox" name="accepted" required>I have reviewed the full Independent Contractor Services Agreement, including exhibits, and agree to electronically sign it.</label><div class="cf-turnstile" data-sitekey="0x4AAAAAAE4-F43E-viFsKat"></div><button type="submit" id="submit">Submit Signed Agreement</button><p id="result" role="status"></p></form></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,s=document.getElementById('result'),button=document.getElementById('submit');s.textContent='Submitting…';button.disabled=true;try{const x=Object.fromEntries(new FormData(f));x.accepted=f.accepted.checked;x.agreement_version='2026-10';x.turnstile_token=window.turnstile?.getResponse()||'';const r=await fetch('https://elpbnytpciqnbexiaebp.supabase.co/functions/v1/independent-contractor-public-apply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(x)});const d=await r.json();if(!r.ok)throw Error(d.error||'Submission failed');s.textContent='Submitted successfully. Tracking number: '+d.tracking_number+'. Please check your email for the account invitation.';f.reset()}catch(err){s.textContent=err.message||'Unable to submit';button.disabled=false;window.turnstile?.reset()}})</script></body></html>
